name: Build and Push z0 to Amazon ECR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - requirements.txt
      - pyproject.toml
      - "z0/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Publish container image
    if: >-
      ${{
        vars.AWS_REGION != '' &&
        vars.ECR_REPOSITORY != '' &&
        vars.AWS_ROLE_TO_ASSUME != ''
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims (temporary diagnostic)
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          parsed = urllib.parse.urlsplit(request_url)
          query = urllib.parse.parse_qsl(parsed.query, keep_blank_values=True)
          query.append(("audience", "sts.amazonaws.com"))
          url = urllib.parse.urlunsplit((
              parsed.scheme, parsed.netloc, parsed.path,
              urllib.parse.urlencode(query), parsed.fragment
          ))
          request = urllib.request.Request(
              url, headers={"Authorization": f"Bearer {request_token}"}
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("iss", "aud", "sub", "repository", "ref"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:12}"

          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            --push \
            .
