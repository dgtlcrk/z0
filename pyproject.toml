[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "z0-network-automation"
version = "1.1.1"
description = "A container-first IRC network automation and diagnostics bot"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "Lorenzo Brown", email = "5753151+dgtlcrk@users.noreply.github.com" }
]
maintainers = [
  { name = "Lorenzo Brown", email = "5753151+dgtlcrk@users.noreply.github.com" }
]
keywords = [
  "automation",
  "docker",
  "irc",
  "networking",
  "terraform"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking"
]
dependencies = [
  "irc==20.5.0",
  "python-dotenv==1.2.2"
]

[project.scripts]

z0-botops = "z0.botops.cli:main"
z0-banner = "z0.botops.banner:main"
z0-platform = "z0.platform_cli:main"
z0-api = "z0.api.server:serve"

z0 = "z0.unified_cli:main"
z0-docker = "z0.docker_cli:main"

[project.urls]
Repository = "https://github.com/dgtlcrk/z0"
Issues = "https://github.com/dgtlcrk/z0/issues"

[tool.setuptools.packages.find]
include = ["z0*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-data]
"z0.config" = ["default.toml"]
