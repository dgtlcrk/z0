[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "z0-network-automation"
version = "1.1.0"
description = "A container-first IRC network automation and diagnostics bot"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "dgtlcrk" }
]
keywords = [
  "automation",
  "docker",
  "irc",
  "networking",
  "terraform"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking"
]
dependencies = [
  "irc==20.5.0",
  "python-dotenv==1.2.2"
]

[project.scripts]
z0 = "z0.main:main"

[project.urls]
Repository = "https://github.com/dgtlcrk/z0"
Issues = "https://github.com/dgtlcrk/z0/issues"

[tool.setuptools.packages.find]
include = ["z0*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
